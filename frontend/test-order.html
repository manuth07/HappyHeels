<!DOCTYPE html>
<html>
<head>
    <title>Test Order Endpoint</title>
</head>
<body>
    <h1>Test Order Creation</h1>
    <form id="orderForm">
        <div>
            <label>Customer Name:</label>
            <input type="text" id="customerName" value="Test Customer" required>
        </div>
        <div>
            <label>Customer Email:</label>
            <input type="email" id="customerEmail" value="test@example.com" required>
        </div>
        <div>
            <label>Customer Phone:</label>
            <input type="tel" id="customerPhone" value="0712345678" required>
        </div>
        <div>
            <label>Shipping Address:</label>
            <textarea id="shippingAddress" required>123 Test Street, Test City</textarea>
        </div>
        <div>
            <label>Bank Slip:</label>
            <input type="file" id="bankSlip" accept="image/*,.pdf" required>
        </div>
        <button type="submit">Create Order</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            
            // Create order data
            const orderData = {
                customerName: document.getElementById('customerName').value,
                customerEmail: document.getElementById('customerEmail').value,
                customerPhone: document.getElementById('customerPhone').value,
                shippingAddress: document.getElementById('shippingAddress').value,
                orderItems: [
                    {
                        productId: 10,
                        productName: "Red heel",
                        quantity: 1,
                        price: 3500
                    }
                ]
            };
            
            formData.append('order', JSON.stringify(orderData));
            
            const bankSlipFile = document.getElementById('bankSlip').files[0];
            if (bankSlipFile) {
                formData.append('bankSlip', bankSlipFile);
            }
            
            try {
                console.log('Sending order request...');
                const response = await fetch('http://localhost:8080/api/orders', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('result').innerHTML = '<h2 style="color: green;">SUCCESS!</h2><pre>' + JSON.stringify(result, null, 2) + '</pre>';
                } else {
                    const errorText = await response.text();
                    document.getElementById('result').innerHTML = '<h2 style="color: red;">ERROR ' + response.status + '</h2><pre>' + errorText + '</pre>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = '<h2 style="color: red;">NETWORK ERROR</h2><pre>' + error.message + '</pre>';
            }
        });
    </script>
</body>
</html>
