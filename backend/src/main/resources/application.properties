# ==========================================================================
# HAPPY HEELS BACKEND CONFIGURATION
# Supports dynamic environment variables with local defaults
# ==========================================================================

# Database Configuration (Supports Railway/Cloud DB env vars or Local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/happyheels?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Kw62590889}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server Port (Railway automatically sets PORT env var)
server.port=${PORT:8080}

# JWT Security Key
jwt.secret=${JWT_SECRET:YourVeryLongAndSecureProductionSecretKeyChangeThisForProduction!}

# Dynamic CORS Configuration (Comma-separated allowed origins or patterns)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost:5174,http://localhost:5175,https://*.vercel.app,https://*.up.railway.app}

# Multipart File Upload Settings
file.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.example.happyheels=INFO